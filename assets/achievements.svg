<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="880" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#faf8f5" />
    </linearGradient>
    <linearGradient id="badge-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c09a57" />
      <stop offset="100%" stop-color="#a67c39" />
    </linearGradient>
    <linearGradient id="badge-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#967caf" />
      <stop offset="100%" stop-color="#775b90" />
    </linearGradient>
    <linearGradient id="badge-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7296b5" />
      <stop offset="100%" stop-color="#527694" />
    </linearGradient>
    <linearGradient id="badge-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c9d87" />
      <stop offset="100%" stop-color="#567b63" />
    </linearGradient>
  </defs>

  <!-- Outer Container -->
  <rect width="880" height="200" rx="14" fill="url(#card-bg)" stroke="#ded8cf" stroke-width="1.2" />

  <!-- Title Header -->
  <g transform="translate(24, 32)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#665344" letter-spacing="1.5">VERIFIED GITHUB ACHIEVEMENTS &amp; RECOGNITION</text>
    <text y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64696e">Ecosystem maintainer acceptances, upstream code merges, and high-velocity triage receipts</text>
  </g>

  <!-- Badges Row -->
  <!-- Badge 1: Galaxy Brain -->
  <g transform="translate(24, 74)">
    <rect width="194" height="98" rx="10" fill="#ffffff" stroke="#967caf" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="34" cy="34" r="16" fill="url(#badge-purple)" fill-opacity="0.2" />
    <text x="34" y="40" font-size="18" text-anchor="middle">🧠</text>
    <text x="60" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2d3034">Galaxy Brain</text>
    <rect x="60" y="36" width="70" height="17" rx="8.5" fill="#967caf" fill-opacity="0.25"/>
    <text x="95" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#6b4791" text-anchor="middle">Accepted x2</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64696e">Maintainer-accepted</text>
    <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64696e">answers in Beets &amp; Typer</text>
  </g>

  <!-- Badge 2: Pull Shark -->
  <g transform="translate(236, 74)">
    <rect width="194" height="98" rx="10" fill="#ffffff" stroke="#7296b5" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="34" cy="34" r="16" fill="url(#badge-blue)" fill-opacity="0.2" />
    <text x="34" y="40" font-size="18" text-anchor="middle">🦈</text>
    <text x="60" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2d3034">Pull Shark</text>
    <rect x="60" y="36" width="65" height="17" rx="8.5" fill="#7296b5" fill-opacity="0.25"/>
    <text x="92" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#285f91" text-anchor="middle">Gold Tier</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64696e">54+ upstream PRs merged</text>
    <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64696e">across 22 global orgs</text>
  </g>

  <!-- Badge 3: Quickdraw -->
  <g transform="translate(448, 74)">
    <rect width="194" height="98" rx="10" fill="#ffffff" stroke="#c09a57" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="34" cy="34" r="16" fill="url(#badge-gold)" fill-opacity="0.2" />
    <text x="34" y="40" font-size="18" text-anchor="middle">⚡</text>
    <text x="60" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2d3034">Quickdraw</text>
    <rect x="60" y="36" width="75" height="17" rx="8.5" fill="#c09a57" fill-opacity="0.25"/>
    <text x="97" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#865b10" text-anchor="middle">Sub-Minute</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64696e">High-velocity incident &amp;</text>
    <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64696e">regression resolution</text>
  </g>

  <!-- Badge 4: Pair Extraordinaire -->
  <g transform="translate(660, 74)">
    <rect width="194" height="98" rx="10" fill="#ffffff" stroke="#7c9d87" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="34" cy="34" r="16" fill="url(#badge-green)" fill-opacity="0.2" />
    <text x="34" y="40" font-size="18" text-anchor="middle">👥</text>
    <text x="60" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#2d3034">Pair Extraordinaire</text>
    <rect x="60" y="36" width="65" height="17" rx="8.5" fill="#7c9d87" fill-opacity="0.25"/>
    <text x="92" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#31704d" text-anchor="middle">Verified</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64696e">Cross-ecosystem</text>
    <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64696e">co-authored commits</text>
  </g>
</svg>