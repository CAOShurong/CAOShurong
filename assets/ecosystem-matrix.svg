<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" fill="none">
  <defs>
    <linearGradient id="matrix-bg" x1="0" y1="0" x2="880" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#faf8f5" />
    </linearGradient>
    <linearGradient id="card-inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#faf8f5" />
    </linearGradient>
    <linearGradient id="accent-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b77e73" /><stop offset="100%" stop-color="#956258" />
    </linearGradient>
    <linearGradient id="accent-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7296b5" /><stop offset="100%" stop-color="#527694" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9985b0" /><stop offset="100%" stop-color="#7d6895" />
    </linearGradient>
    <linearGradient id="accent-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bf926a" /><stop offset="100%" stop-color="#9d7450" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c9d87" /><stop offset="100%" stop-color="#567b63" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c9fa3" /><stop offset="100%" stop-color="#5a7e82" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="880" height="280" rx="14" fill="url(#matrix-bg)" stroke="#ded8cf" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(28, 30)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#665344" letter-spacing="1.5">TIER-1 OPEN SOURCE FOUNDATION CONTRIBUTOR FOOTPRINT</text>
    <text y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64696e">Direct core code merges across Apache, GitHub Official, NumFOCUS, Linux Foundation, PyPA &amp; Plotly</text>
  </g>

  <!-- Row 1 Cards -->
  <!-- Card 1: Apache Foundation -->
  <g transform="translate(28, 68)">
    <rect width="258" height="84" rx="8" fill="url(#card-inner)" stroke="#b77e73" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="14" y="14" width="6" height="56" rx="3" fill="url(#accent-red)" />
    <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2d3034">Apache Software Foundation</text>
    <text x="30" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#31704d">PR #1118 · e8c3a346 (Merged)</text>
    <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#64696e">Triage interaction loop &amp; test fixtures</text>
  </g>

  <!-- Card 2: GitHub Official -->
  <g transform="translate(311, 68)">
    <rect width="258" height="84" rx="8" fill="url(#card-inner)" stroke="#665344" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="14" y="14" width="6" height="56" rx="3" fill="url(#accent-blue)" />
    <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2d3034">GitHub Official (MCP)</text>
    <text x="30" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#31704d">PR #3146 · ffa16d00 (Merged)</text>
    <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#64696e">Headerless URL flags &amp; OAuth raw queries</text>
  </g>

  <!-- Card 3: NumFOCUS / Astropy -->
  <g transform="translate(594, 68)">
    <rect width="258" height="84" rx="8" fill="url(#card-inner)" stroke="#bf926a" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="14" y="14" width="6" height="56" rx="3" fill="url(#accent-orange)" />
    <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2d3034">Astropy / NumFOCUS</text>
    <text x="30" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#31704d">PR #20256 (Merged) · #20359 (Core)</text>
    <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#64696e">IERS accuracy &amp; Table primary-key engine</text>
  </g>

  <!-- Row 2 Cards -->
  <!-- Card 4: Linux Foundation / OpenSSF -->
  <g transform="translate(28, 164)">
    <rect width="258" height="84" rx="8" fill="url(#card-inner)" stroke="#7c9fa3" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="14" y="14" width="6" height="56" rx="3" fill="url(#accent-cyan)" />
    <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2d3034">OpenSSF / Linux Foundation</text>
    <text x="30" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#285f91">PR #5202 · Active in Scorecard</text>
    <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#64696e">GitHub CLI &amp; Nextcloud release detection</text>
  </g>

  <!-- Card 5: PyPA / PSF -->
  <g transform="translate(311, 164)">
    <rect width="258" height="84" rx="8" fill="url(#card-inner)" stroke="#9985b0" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="14" y="14" width="6" height="56" rx="3" fill="url(#accent-purple)" />
    <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2d3034">PyPA / Python Packaging</text>
    <text x="30" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#31704d">PR #2977 &amp; #2966 (Merged)</text>
    <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#64696e">cibuildwheel Windows NuGet &amp; platform docs</text>
  </g>

  <!-- Card 6: Plotly Core -->
  <g transform="translate(594, 164)">
    <rect width="258" height="84" rx="8" fill="url(#card-inner)" stroke="#7c9d87" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="14" y="14" width="6" height="56" rx="3" fill="url(#accent-green)" />
    <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2d3034">Plotly Core (plotly.js)</text>
    <text x="30" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#31704d">PR #7981 · cc143a1c (Merged)</text>
    <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#64696e">Cartesian hovermode cursor spike mechanics</text>
  </g>

  <!-- Footer Indicator -->
  <g transform="translate(28, 264)">
    <circle cx="4" cy="-4" r="3.5" fill="#5c8566" />
    <text x="14" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#64696e" letter-spacing="0.5">38+ VERIFIED MERGED UPSTREAM PRS · 22 GLOBAL ORGANIZATIONS · ALL CLAIMS SUPPORTED BY PUBLIC GIT RECEIPTS</text>
  </g>
