name: Contributor evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify deterministic profile asset
        run: python scripts/generate_contributor_evidence.py --check
      - name: Compare snapshot with live public GitHub state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_contributor_evidence.py --check --verify-live
      - name: Test profile content, evidence schema and claim boundaries
        run: python -m unittest discover -s tests -v
